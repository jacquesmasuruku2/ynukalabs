name: Deploy Ynukalabs to InterServer via SSH

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build main frontend
        run: npm run build

      - name: Copy PHP folder to dist
        run: cp -r php dist/

      - name: Build admin panel
        working-directory: ./ynuka-admin
        run: |
          npm install
          npm run build

      - name: Create admin output directory
        run: mkdir -p dist-admin

      - name: Copy admin build to dist-admin
        run: |
          if [ -d "ynuka-admin/dist" ]; then
            cp -r ynuka-admin/dist/* dist-admin/
          fi

      - name: Copy admin API to dist-admin
        run: |
          if [ -d "ynuka-admin/php-api" ]; then
            cp ynuka-admin/php-api/api.php dist-admin/
            cp ynuka-admin/php-api/setup.sql dist-admin/
          fi

      - name: Copy .htaccess for admin SPA routing
        run: |
          if [ -f "ynuka-admin/.htaccess" ]; then
            cp ynuka-admin/.htaccess dist-admin/
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add remote host key to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy main frontend to remote server
        run: |
          rsync -avz --delete dist/ "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_TARGET_DIR }}"

      - name: Deploy admin panel to subdomain
        run: |
          rsync -avz --delete dist-admin/ "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/domains/admin.ynukalabs.com/public_html/"
