name: Deploy Ynuka Site

on:
  push:
    branches: [main]
    paths:
      - 'Ynuka Site/**'
      - '.github/workflows/deploy-site.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd "Ynuka Site" && npm install

      - name: Build project
        run: cd "Ynuka Site" && npm run build

      - name: Inspect build output
        run: |
          ls -la "Ynuka Site"
          ls -la "Ynuka Site/dist" || true
          ls -la "Ynuka Site/php" || true

      - name: Deploy to Interserver
        uses: appleboy/scp-action@master
        working-directory: "Ynuka Site"
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: |
            dist/*
            php/api.php
            php/config.php
            php/database.php
          target: "/home/ynukalab/public_html/"
          strip_components: 1
          overwrite: true

      - name: Verify deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "✓ Ynuka Site deployed"
            ls /home/ynukalab/public_html/index.html
            curl -s https://ynukalabs.com/api.php?action=ping | head -20
