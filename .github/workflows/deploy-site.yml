name: Deploy Ynuka Site

on:
  push:
    branches: ['**']
    paths:
      - 'Ynuka Site/**'
      - '.github/workflows/deploy-site.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd "Ynuka Site" && npm install

      - name: Build project
        run: cd "Ynuka Site" && npm run build

      - name: Verify build output
        run: |
          echo "Checking Ynuka Site/dist contents:"
          ls -la "Ynuka Site/dist/" || exit 1
          echo "Checking PHP files:"
          ls -la "Ynuka Site/php/" || exit 1

      - name: Prepare deployment files
        run: |
          mkdir -p deploy_site/api
          cp -r "Ynuka Site/dist"/* deploy_site/
          cp "Ynuka Site/php/api.php" deploy_site/api/
          cp "Ynuka Site/php/config.php" deploy_site/api/
          cp "Ynuka Site/php/database.php" deploy_site/api/
          echo "Files ready for deployment:"
          ls -la deploy_site/

      - name: Deploy to Interserver
        if: github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy_site/*"
          target: "domains/ynukalabs.com/public_html/"
          strip_components: 1
          overwrite: true

      - name: Verify deployment
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "✓ Ynuka Site deployment started"
            SITE_DIR="domains/ynukalabs.com/public_html"

            chmod 755 "$SITE_DIR"
            chmod 644 "$SITE_DIR/index.html"
            chmod -R 755 "$SITE_DIR/api" 2>/dev/null || true
            chmod -R 644 "$SITE_DIR/api"/* 2>/dev/null || true
            chmod -R 755 "$SITE_DIR/assets" 2>/dev/null || true
            chmod -R 644 "$SITE_DIR/assets"/* 2>/dev/null || true

            ls -lh "$SITE_DIR/index.html"
            ls -la "$SITE_DIR/api/" | head -5
            echo "✓ Ynuka Site deployed successfully to $SITE_DIR"
