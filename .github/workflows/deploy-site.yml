name: Deploy Ynuka Site

on:
  push:
    branches: [main]
    paths:
      - 'Ynuka Site/**'
      - '.github/workflows/deploy-site.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd "Ynuka Site" && npm install

      - name: Build project
        run: cd "Ynuka Site" && npm run build

      - name: Verify build output
        run: |
          echo "Checking Ynuka Site/dist contents:"
          ls -la "Ynuka Site/dist/" || exit 1
          echo "Checking PHP files:"
          ls -la "Ynuka Site/php/" || exit 1

      - name: Prepare deployment files
        run: |
          mkdir -p deploy_site/api
          cp -r "Ynuka Site/dist"/* deploy_site/
          cp "Ynuka Site/php/api.php" deploy_site/api/
          cp "Ynuka Site/php/config.php" deploy_site/api/
          cp "Ynuka Site/php/database.php" deploy_site/api/
          echo "Files ready for deployment:"
          ls -la deploy_site/

      - name: Deploy to Interserver
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy_site/*"
          target: "/home/ynukalab/public_html/"
          strip_components: 1
          overwrite: true

      - name: Verify deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "✓ Ynuka Site deployed"
            ls /home/ynukalab/public_html/index.html
            curl -s https://ynukalabs.com/api.php?action=ping | head -20
