name: Deploy Admin Ynuka SPA

on:
  push:
    branches: [main]
    paths:
      - 'Admin Ynuka/**'
      - '.github/workflows/deploy-admin.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd "Admin Ynuka" && npm install

      - name: Build SPA
        run: cd "Admin Ynuka" && npm run build:spa

      - name: Deploy Admin SPA to Interserver
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: |
            "Admin Ynuka/dist/*"
            "Admin Ynuka/index-spa.html"
            "Admin Ynuka/.htaccess-spa"
          target: "/home/ynukalab/admin.ynukalabs.com/"
          strip_components: 2
          overwrite: true

      - name: Verify Admin deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "✓ Admin SPA deployed"
            ls /home/ynukalab/admin.ynukalabs.com/index-spa.html
            ls /home/ynukalab/admin.ynukalabs.com/.htaccess
