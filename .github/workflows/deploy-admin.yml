name: Deploy Admin Ynuka SPA

on:
  push:
    branches: [main]
    paths:
      - 'Admin Ynuka/**'
      - '.github/workflows/deploy-admin.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd "Admin Ynuka" && npm install

      - name: Build SPA
        run: cd "Admin Ynuka" && npm run build:spa

      - name: Verify build output
        run: |
          echo "Checking Admin Ynuka/dist contents:"
          ls -la "Admin Ynuka/dist/" || exit 1
          echo "Checking .htaccess-spa:"
          ls -la "Admin Ynuka/.htaccess-spa" || exit 1

      - name: Prepare deployment files
        run: |
          mkdir -p deploy_admin
          cp -r "Admin Ynuka/dist"/* deploy_admin/
          cp "Admin Ynuka/.htaccess-spa" deploy_admin/
          echo "Files ready for deployment:"
          ls -la deploy_admin/

      - name: Deploy Admin SPA to Interserver
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy_admin/*"
          target: "/home/ynukalab/admin.ynukalabs.com/"
          strip_components: 1
          overwrite: true

      - name: Verify Admin deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "✓ Admin SPA deployed"
            mv /home/ynukalab/admin.ynukalabs.com/.htaccess-spa /home/ynukalab/admin.ynukalabs.com/.htaccess 2>/dev/null || true
            ls /home/ynukalab/admin.ynukalabs.com/index-spa.html
            ls /home/ynukalab/admin.ynukalabs.com/.htaccess
