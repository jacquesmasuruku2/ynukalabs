name: Deploy Panel Admin

on:
  push:
    branches: ['**']
    paths:
      - 'admin-panel/**'
      - '.github/workflows/deploy-admin.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd "admin-panel" && npm install

      - name: Build admin panel
        run: cd "admin-panel" && npm run build

      - name: Verify build output
        run: |
          echo "Checking admin-panel/.next contents:"
          ls -la "admin-panel/.next" || exit 1

      - name: Prepare deployment files
        run: |
          mkdir -p deploy_admin
          cp -r "admin-panel/.next"/* deploy_admin/
          echo "Files ready for deployment:"
          ls -la deploy_admin/

      - name: Deploy Admin to Interserver
        if: github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy_admin/*"
          target: "domains/admin.ynukalabs.com/public_html/"
          strip_components: 1
          overwrite: true

      - name: Verify Admin deployment
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "✓ Admin deployment started"
            ADMIN_DIR="domains/admin.ynukalabs.com/public_html"
            chmod 755 "$ADMIN_DIR"
            chmod -R 755 "$ADMIN_DIR" 2>/dev/null || true
            ls -la "$ADMIN_DIR" | head -20
            echo "✓ Admin deployment completed"
