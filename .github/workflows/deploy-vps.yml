name: Deploy Ynuka frontend to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'Ynuka Site/**'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:

concurrency:
  group: ynuka-frontend-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 'Ynuka Site/package-lock.json'

      - name: Install dependencies
        working-directory: 'Ynuka Site'
        run: npm ci

      - name: Build frontend
        working-directory: 'Ynuka Site'
        run: npm run build

      - name: Prepare deployment files
        run: |
          mkdir -p deploy-dist
          cp -a "Ynuka Site/dist/." deploy-dist/
          cp "Ynuka Site/.htaccess" deploy-dist/.htaccess

      - name: Copy build to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: deploy-dist
          target: "/var/www/ynukalabs/frontend/Ynuka Site/dist/"
          strip_components: 1
          overwrite: true

      - name: Restart frontend on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: pm2 restart ynuka-frontend --update-env
