name: Deploy Ynukalabs to InterServer

on:
  push:
    branches:
      - main  # (le nom de ma branche principale)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies and Build
        run: |
          npm install
          npm run build

      - name: Deploy to Server via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*"
          target: "domains/ynukalabs.com/public_html/"
          strip_components: 1