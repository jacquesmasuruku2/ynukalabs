<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Blue background circle -->
  <circle cx="100" cy="100" r="100" fill="#003D99"/>
  
  <!-- Yellow network hexagon/nodes -->
  <!-- Center hexagon -->
  <path d="M100 70 L115 80 L115 100 L100 110 L85 100 L85 80 Z" fill="none" stroke="#FFDD00" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Top left node -->
  <circle cx="60" cy="50" r="6" fill="#FFDD00"/>
  <line x1="85" y1="80" x2="60" y2="50" stroke="#FFDD00" stroke-width="2"/>
  
  <!-- Top right node -->
  <circle cx="140" cy="50" r="6" fill="#FFDD00"/>
  <line x1="115" y1="80" x2="140" y2="50" stroke="#FFDD00" stroke-width="2"/>
  
  <!-- Right node -->
  <circle cx="155" cy="100" r="6" fill="#FFDD00"/>
  <line x1="115" y1="100" x2="155" y2="100" stroke="#FFDD00" stroke-width="2"/>
  
  <!-- Bottom right node -->
  <circle cx="140" cy="150" r="6" fill="#FFDD00"/>
  <line x1="115" y1="100" x2="140" y2="150" stroke="#FFDD00" stroke-width="2"/>
  
  <!-- Bottom left node -->
  <circle cx="60" cy="150" r="6" fill="#FFDD00"/>
  <line x1="85" y1="100" x2="60" y2="150" stroke="#FFDD00" stroke-width="2"/>
  
  <!-- Left node -->
  <circle cx="45" cy="100" r="6" fill="#FFDD00"/>
  <line x1="85" y1="100" x2="45" y2="100" stroke="#FFDD00" stroke-width="2"/>
  
  <!-- Center node circle -->
  <circle cx="100" cy="90" r="5" fill="#FFDD00"/>
